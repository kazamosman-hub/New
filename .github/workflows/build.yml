name: Build APK Directly From ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP on GitHub Server
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: extracted_project
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatSub-v1.6.3-APK
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
